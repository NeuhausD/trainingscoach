name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-not-a-secret
          AUTH_MICROSOFT_ENTRA_ID_ID: ci
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ci
          AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/common/v2.0
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
